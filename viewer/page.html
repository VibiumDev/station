<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="{{.Assets}}/viewer/viewer.css">
</head>
<body data-device="{{.DeviceID}}" data-api="{{.API}}" data-csrf="{{.CSRF}}" data-shortcuts="{{.ShortcutsJSON}}" data-input="{{.Input}}" data-assets="{{.Assets}}">
<div id="toolbar">
  <a href="{{.Back}}">&larr;</a>
  <span class="name">{{.DeviceName}}</span>
  <button type="button" id="speakerBtn" title="Sound from the device">Speaker</button>
  <button type="button" id="micBtn" title="Your microphone into the device">Mic</button>
  <span class="sep"></span>
  <button type="button" id="mouseBtn" title="Clicks as a mouse">Mouse</button>
  <button type="button" id="touchBtn" title="Clicks as a finger">Touch</button>
  <button type="button" id="kbdBtn" title="Keys you type go to the device">Keyboard</button>
  <span class="sep"></span>
  <span id="shortcuts"></span>
  <span class="sep"></span>
  <button type="button" id="statsBtn" title="Picture and sound numbers">Stats</button>
  <button type="button" id="takeBtn" title="Take the device"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11.5V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1.4"/><path d="M14 10V8a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 9.9V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v5"/><path d="M6 14a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8 2 2 0 1 1 4 0"/></svg> Hold</button>
  <button type="button" id="releaseBtn" title="Let the device go"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg> Release</button>
  <span id="status"></span>
</div>
<div id="viewer">
  <img id="feed" alt="">
  <video id="rtcVideo" autoplay playsinline muted disablepictureinpicture></video>
  <audio id="rtcAudio" autoplay></audio>
  <div id="rtcStats"></div>
  <div id="note"></div>
</div>
<script src="{{.Assets}}/viewer/input.js"></script>
<script src="{{.Assets}}/viewer/viewer.js"></script>
<script src="{{.Assets}}/viewer/webrtc.js"></script>
</body>
</html>
