<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="{{.Assets}}/viewer/viewer.css">
</head>
<body data-device="{{.DeviceID}}" data-api="{{.API}}" data-csrf="{{.CSRF}}" data-shortcuts="{{.ShortcutsJSON}}" data-input="{{.Input}}" data-assets="{{.Assets}}">
<div id="toolbar">
  <a href="{{.Back}}">&larr;</a>
  <span class="name">{{.DeviceName}}</span>
  <button type="button" id="speakerBtn" title="Sound from the device">Speaker</button>
  <button type="button" id="micBtn" title="Your microphone into the device">Mic</button>
  <span class="sep"></span>
  <button type="button" id="mouseBtn" title="Clicks as a mouse">Mouse</button>
  <button type="button" id="touchBtn" title="Clicks as a finger">Touch</button>
  <button type="button" id="kbdBtn" title="Keys you type go to the device">Keyboard</button>
  <span class="sep"></span>
  <span id="shortcuts"></span>
  <span class="sep"></span>
  <button type="button" id="statsBtn" title="Picture and sound numbers">Stats</button>
  <button type="button" id="takeBtn" title="Take the device"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2M5 8h6a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1"/></svg> Hold</button>
  <button type="button" id="releaseBtn" title="Let the device go"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M11 1a2 2 0 0 0-2 2v4a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h5V3a3 3 0 0 1 6 0v4a.5.5 0 0 1-1 0V3a2 2 0 0 0-2-2M3 8a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1z"/></svg> Release</button>
  <span id="status"></span>
</div>
<div id="viewer">
  <img id="feed" alt="">
  <video id="rtcVideo" autoplay playsinline muted disablepictureinpicture></video>
  <audio id="rtcAudio" autoplay></audio>
  <div id="rtcStats"></div>
  <div id="note"></div>
</div>
<script src="{{.Assets}}/viewer/input.js"></script>
<script src="{{.Assets}}/viewer/viewer.js"></script>
<script src="{{.Assets}}/viewer/webrtc.js"></script>
</body>
</html>
