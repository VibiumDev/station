<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="{{.Assets}}/viewer/shell.css">
<script src="{{.Assets}}/viewer/pages.js"></script>
{{if .Minimal}}<style>#toolbar { display:none !important; }</style>
{{end}}</head>
<body class="tb-left" style="margin:0; display:flex; height:100vh; height:100dvh; overscroll-behavior:none;" data-config="{{.ConfigJSON}}">
  <div style="flex:1; min-width:0; min-height:0; display:flex; flex-direction:column;">
    <div id="viewer" style="position:relative; flex:1; min-width:0; min-height:0; overflow:hidden; user-select:none; -webkit-user-select:none;">
      <div id="overlay" style="display:flex;">
        Connecting&hellip;
      </div>
      <video id="rtcVideo" autoplay playsinline muted disablepictureinpicture style="position:absolute; display:none; pointer-events:none; background:#000;"></video>
<audio id="rtcAudio" autoplay style="display:none;"></audio>
      <div id="rtcStats" style="display:none;"></div>
      <img id="feed" draggable="false" style="max-width:100%; max-height:100%; display:none; touch-action:none; cursor:crosshair; position:relative; z-index:1;">
      <div id="turnNote"><span>Busy&hellip;</span></div>
    </div>
    <div id="onscreen-kbd" style="display:none; user-select:none; -webkit-user-select:none; overflow-x:auto;">
      <div id="kbd-inner" style="padding:6px 8px;">
      <div id="kbd-body" style="background:var(--kbd-bg); border-radius:8px; padding:6px; display:inline-block;">
      <div class="kr" id="kr-0"></div>
      <div class="kr" id="kr-1"></div>
      <div class="kr" id="kr-2"></div>
      <div class="kr" id="kr-3"></div>
      <div class="kr" id="kr-4"></div>
      <div class="kr" id="kr-5"></div>
      </div>
      </div>
    </div>
  </div>
  <div id="toolbar" style="display:flex;">
    {{if .Home}}<a id="homeLink" class="tbtn" href="{{.Home}}" title="{{.HomeTitle}}"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5zM2.5 2a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5zm6.5.5A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5zm1.5-.5a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5zM1 10.5A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5zm1.5-.5a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5zm6.5.5A1.5 1.5 0 0 1 10.5 9h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5zm1.5-.5a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5z"/></svg></a>
    {{end}}<button id="qbtn" class="tbtn" title="Settings"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/></svg></button>
    {{if .Drive}}<a id="driveLink" class="tbtn" href="{{.Drive}}" title="Drive"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 14.5V21M9.8 10.9 4.1 7.6M14.2 10.9l5.7-3.3"/></svg></a>
    {{end}}{{if .Watch}}<a id="watchLink" class="tbtn" href="{{.Watch}}" title="Watch"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></a>
    {{end}}<button id="unmute" class="tbtn" style="display:none;" title="Toggle audio"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06m7.137 2.096a.5.5 0 0 1 0 .708L12.207 8l1.647 1.646a.5.5 0 0 1-.708.708L11.5 8.707l-1.646 1.647a.5.5 0 0 1-.708-.708L10.793 8 9.146 6.354a.5.5 0 1 1 .708-.708L11.5 7.293l1.646-1.647a.5.5 0 0 1 .708 0"/></svg></button>
    <button id="ptt" class="tbtn" title="Toggle microphone"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M5 3a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0z"/><path d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5"/></svg></button>
    <button id="kbdBtn" class="tbtn" style="opacity:0.4;" title="On-screen keyboard"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M0 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm13 .25v.5c0 .138.112.25.25.25h.5a.25.25 0 0 0 .25-.25v-.5a.25.25 0 0 0-.25-.25h-.5a.25.25 0 0 0-.25.25M2.25 8a.25.25 0 0 0-.25.25v.5c0 .138.112.25.25.25h.5A.25.25 0 0 0 3 8.75v-.5A.25.25 0 0 0 2.75 8zM4 8.25v.5c0 .138.112.25.25.25h.5A.25.25 0 0 0 5 8.75v-.5A.25.25 0 0 0 4.75 8h-.5a.25.25 0 0 0-.25.25M6.25 8a.25.25 0 0 0-.25.25v.5c0 .138.112.25.25.25h.5A.25.25 0 0 0 7 8.75v-.5A.25.25 0 0 0 6.75 8zM8 8.25v.5c0 .138.112.25.25.25h.5A.25.25 0 0 0 9 8.75v-.5A.25.25 0 0 0 8.75 8h-.5a.25.25 0 0 0-.25.25M13.25 8a.25.25 0 0 0-.25.25v.5c0 .138.112.25.25.25h.5a.25.25 0 0 0 .25-.25v-.5a.25.25 0 0 0-.25-.25zm0 2a.25.25 0 0 0-.25.25v.5c0 .138.112.25.25.25h.5a.25.25 0 0 0 .25-.25v-.5a.25.25 0 0 0-.25-.25zm-3-2a.25.25 0 0 0-.25.25v.5c0 .138.112.25.25.25h1.5a.25.25 0 0 0 .25-.25v-.5a.25.25 0 0 0-.25-.25zm.75 2.25v.5c0 .138.112.25.25.25h.5a.25.25 0 0 0 .25-.25v-.5a.25.25 0 0 0-.25-.25h-.5a.25.25 0 0 0-.25.25M11.25 6a.25.25 0 0 0-.25.25v.5c0 .138.112.25.25.25h.5a.25.25 0 0 0 .25-.25v-.5a.25.25 0 0 0-.25-.25zM9 6.25v.5c0 .138.112.25.25.25h.5a.25.25 0 0 0 .25-.25v-.5A.25.25 0 0 0 9.75 6h-.5a.25.25 0 0 0-.25.25M7.25 6a.25.25 0 0 0-.25.25v.5c0 .138.112.25.25.25h.5A.25.25 0 0 0 8 6.75v-.5A.25.25 0 0 0 7.75 6zM5 6.25v.5c0 .138.112.25.25.25h.5A.25.25 0 0 0 6 6.75v-.5A.25.25 0 0 0 5.75 6h-.5a.25.25 0 0 0-.25.25M2.25 6a.25.25 0 0 0-.25.25v.5c0 .138.112.25.25.25h1.5A.25.25 0 0 0 4 6.75v-.5A.25.25 0 0 0 3.75 6zM2 10.25v.5c0 .138.112.25.25.25h.5a.25.25 0 0 0 .25-.25v-.5a.25.25 0 0 0-.25-.25h-.5a.25.25 0 0 0-.25.25M4.25 10a.25.25 0 0 0-.25.25v.5c0 .138.112.25.25.25h5.5a.25.25 0 0 0 .25-.25v-.5a.25.25 0 0 0-.25-.25z"/></svg></button>
    <span id="deviceButtons" style="display:contents;"></span>
    <button id="shotBtn" class="tbtn" title="Save a screenshot"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/><path d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.17a2 2 0 0 1-1.42-.59l-.82-.82A2 2 0 0 0 9.17 2H6.83a2 2 0 0 0-1.42.59l-.82.82A2 2 0 0 1 3.17 4zm6 1.5a3 3 0 1 1 0 6 3 3 0 0 1 0-6"/></svg></button>
    <button id="takeBtn" class="tbtn" style="display:none;" title="Hold the device"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1 3.5a.5.5 0 0 1 .5-.5h13a.5.5 0 0 1 0 1h-13a.5.5 0 0 1-.5-.5M8 6a.5.5 0 0 1 .5.5v5.793l2.146-2.147a.5.5 0 0 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-3-3a.5.5 0 0 1 .708-.708L7.5 12.293V6.5A.5.5 0 0 1 8 6"/></svg></button>
    <button id="releaseBtn" class="tbtn" style="display:none;" title="Release the device"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg></button>
    <span id="holdStatus" title=""></span>
    <span id="recNote" style="display:none" title="This session is being recorded by the host: each input, a frame of the screen after each burst of input and, where the host can, a video of the screen, the device's sound and what is sent to its microphone (your voice, when your microphone is on), uploaded to the station's Record Store when the session ends.">● <span class="long">recording screen, sound and input</span><span class="short">REC</span></span>
    <div id="qslider" style="display:none;">
      <div id="videoRow" class="qrow" style="display:none;">
        <label class="qlabel">Video</label>
        <div class="seg">
          <button id="videoMJPEGBtn">MJPEG</button>
          <button id="videoWebRTCBtn">WebRTC</button>
        </div>
        <label class="qcheck" title="Frame rate, bitrate and delays over the picture"><input id="videoStatsCheck" type="checkbox"> Stats</label>
      </div>
      <div id="deviceRowsTop" style="display:contents;"></div>
      <div id="bitrateRow" class="qrow" style="display:none;" title="The most the H.264 stream may use; auto lets the connection decide, up to 4 Mbps">
        <label class="qlabel">Bitrate</label>
        <input id="bitrateRange" type="range" min="300" max="4000" step="100" value="4000">
        <span id="bitrateVal" class="qval">auto</span>
      </div>
      <div id="inputRows" style="display:contents;">
      <div class="qrow">
        <label class="qlabel">Input</label>
        <div class="seg">
          <button id="modeMouseBtn">Mouse</button>
          <button id="modeTouchBtn">Touch</button>
        </div>
      </div>
      <div class="qrow" title="How far the wheel scrolls the target">
        <label class="qlabel">Scroll</label>
        <input id="scrollRange" type="range" min="25" max="200" step="5" value="100">
        <span id="scrollVal" class="qval">100%</span>
      </div>
      <div class="qrow">
        <label class="qlabel">Keys</label>
        <label class="qcheck"><input id="kbdCaptureCheck" type="checkbox" checked> Capture</label>
      </div>
      <div class="qrow">
        <label class="qlabel">Kbd Size</label>
        <input id="kbdZoomRange" type="range" min="50" max="200" value="100">
        <span id="kbdZoomVal" class="qval">100%</span>
      </div>
      </div>
      <div id="deviceRowsMiddle" style="display:contents;"></div>
      <div class="qrow" title="Fit scales the picture to the room it has; the slider sets it by hand">
        <label class="qlabel">Zoom</label>
        <div class="seg">
          <button id="zoomFitBtn">Fit</button>
        </div>
        <input id="zoomRange" type="range" min="50" max="400" value="100" class="short">
        <span id="zoomVal" class="qval">100%</span>
      </div>
      <div class="qrow">
        <label class="qlabel">Align</label>
        <div class="seg">
          <button id="alignTLBtn">Top-Left</button>
          <button id="alignCenterBtn">Center</button>
        </div>
      </div>
      <div class="qrow">
        <label class="qlabel">Theme</label>
        <div class="seg">
          <button id="themeDarkBtn">Dark</button>
          <button id="themeLightBtn">Light</button>
          <button id="themeSystemBtn">System</button>
        </div>
      </div>
      <div class="qrow" title="JPEG quality of the Screenshot button's pictures">
        <label class="qlabel">Screenshot</label>
        <input id="shotQualityRange" type="range" min="30" max="95" value="90">
        <span id="shotQualityVal" class="qval">90</span>
      </div>
      <div id="deviceRowsBottom" style="display:contents;"></div>
      <div class="qrow divider">
        <label class="qlabel">Toolbar</label>
        <div class="seg">
          <button id="tbShowBtn" title="Always show the toolbar">Show</button>
          <button id="tbAutoBtn" title="Tuck the toolbar off the right edge; it comes back when the pointer reaches the edge">Auto-hide</button>
          <button id="tbOffBtn" title="No toolbar. Bring it back with ?toolbar=show in the address">Off</button>
        </div>
      </div>
      <div class="qrow">
        <label class="qlabel">Side</label>
        <div class="seg">
          <button id="tbSideTop">Top</button>
          <button id="tbSideRight">Right</button>
          <button id="tbSideBottom">Bottom</button>
          <button id="tbSideLeft">Left</button>
        </div>
      </div>
    </div>
  </div>
  <div id="tbHandle" title="Show the toolbar"></div>
  <script src="{{.Assets}}/viewer/shell.js"></script>
  <script src="{{.Assets}}/viewer/webrtc.js"></script>
</body>
</html>
