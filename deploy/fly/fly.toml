# A public Vibium Station on Fly.io. TLS ends at Fly's edge and the station
# serves plain HTTP behind it (--http, --public-url); TURN needs the app's
# dedicated IPv4 (fly ips allocate-v4), since Fly carries UDP only on one,
# bound to fly-global-services on the same ports outside and in; the data
# directory is a volume. Fly's private network (fdaa::/16) is unique-local,
# which TURN refuses by itself.
#
#   fly apps create NAME && fly ips allocate-v4 -a NAME
#   fly volumes create station_data --size 1 -r REGION -a NAME
#   fly secrets set STATION_PASSWORD=... -a NAME
#   fly deploy -c deploy/fly/fly.toml --dockerfile Dockerfile
#
# Then put the app's IPv4 in --turn-public-ip below, and make an API token
# or an enrollment code with: fly ssh console -C "station token create NAME"
app = "vibium-station-test"
primary_region = "ord"

[env]
  STATION_DIR = "/data"

[[mounts]]
  source = "station_data"
  destination = "/data"

[processes]
  app = "station --http :8080 --public-url https://vibium-station-test.fly.dev --name 'Vibium test station' --no-mdns --turn on --turn-listen fly-global-services:3478 --turn-relay-addr fly-global-services --turn-public-ip 168.220.91.139 --turn-ports 49152-49215"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# TURN itself.
[[services]]
  protocol = "udp"
  internal_port = 3478
  processes = ["app"]
  [[services.ports]]
    port = 3478

# The relay ports, one per allocation: 64 is plenty for a test station.
[[services]]
  protocol = "udp"
  internal_port = 49152
  processes = ["app"]
  [[services.ports]]
    start_port = 49152
    end_port = 49215

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
